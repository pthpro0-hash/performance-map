name: 공연 데이터 주간 갱신

# 이 워크플로는 GitHub 서버에서 돈다. 내 PC가 꺼져 있어도 갱신된다.
#
# 인증키는 저장소에 없다. Settings > Secrets and variables > Actions 에
# KOPIS_API_KEY 를 등록해야 동작한다.

on:
  schedule:
    # cron은 UTC 기준이다. 월요일 04:00 KST = 일요일 19:00 UTC.
    - cron: '0 19 * * 0'
  # Actions 탭에서 버튼으로 즉시 돌릴 수도 있다.
  workflow_dispatch:
    inputs:
      months_back:
        description: '과거 몇 개월부터 수집할지 (평소에는 3 그대로 두세요. 줄이면 공연이 그만큼 빠집니다)'
        required: false
        default: '3'
      months_ahead:
        description: '미래 몇 개월까지 수집할지 (평소에는 6 그대로)'
        required: false
        default: '6'

# 커밋을 되돌려 push 하려면 쓰기 권한이 필요하다.
permissions:
  contents: write

# 이전 실행이 아직 돌고 있으면 새로 시작하지 않는다(중복 커밋 방지).
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    # 스크립트가 Windows 경로(\)를 쓰므로 windows 러너에서 그대로 돌린다.
    # 공개 저장소라 Actions 사용 시간은 무료다.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 인증키 확인
        shell: pwsh
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KOPIS_API_KEY)) {
            Write-Host "::error::KOPIS_API_KEY 시크릿이 없습니다."
            Write-Host "저장소 Settings > Secrets and variables > Actions > New repository secret 에서"
            Write-Host "이름을 KOPIS_API_KEY 로 등록하세요."
            exit 1
          }
          Write-Host "인증키 확인 (길이 $($env:KOPIS_API_KEY.Length))"

      # 공연장 좌표는 잘 변하지 않는다. 캐시해 두면 매주 760여 건의 호출을 아낀다.
      # 공연 상세는 일부러 캐시하지 않는다. 매주 새로 받아야 가격·예매처가 최신으로 유지된다.
      - name: 공연장 캐시 복원
        uses: actions/cache@v4
        with:
          path: tools/venues.json
          key: venues-${{ github.run_id }}
          restore-keys: |
            venues-

      - name: 데이터 수집
        shell: pwsh
        working-directory: tools
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
        run: |
          $back  = if ('${{ inputs.months_back }}')  { '${{ inputs.months_back }}' }  else { 3 }
          $ahead = if ('${{ inputs.months_ahead }}') { '${{ inputs.months_ahead }}' } else { 6 }
          ./update-performances.ps1 -MonthsBack ([int]$back) -MonthsAhead ([int]$ahead) -NoBackup
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 지도 데이터 생성
        shell: pwsh
        run: |
          # 절대 경로로 넘긴다. Write-Utf8NoBom이 [System.IO.File]::WriteAllText를 쓰는데,
          # .NET은 상대 경로를 PowerShell의 현재 위치가 아니라 프로세스 작업 디렉터리로 푼다.
          # 둘이 어긋나면 파일이 엉뚱한 곳에 생긴다.
          ./tools/build-map.ps1 `
            -InFile  "${{ github.workspace }}/tools/performances.json" `
            -OutFile "${{ github.workspace }}/performances-data.js"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 결과 요약
        shell: pwsh
        run: |
          $m = (Get-Content "${{ github.workspace }}/tools/performances.json" -Raw -Encoding UTF8 | ConvertFrom-Json)._meta
          $kb = [math]::Round((Get-Item "${{ github.workspace }}/performances-data.js").Length / 1KB)
          # Actions 실행 요약 화면에 표로 남긴다. 로그를 뒤지지 않아도 결과가 보인다.
          # 실제로 적용된 수집 범위를 함께 남긴다.
          # Run workflow 폼에서 값을 바꾸면 건수가 크게 달라지는데,
          # 나중에 결과만 보면 "왜 이번엔 적지?" 하고 원인을 못 찾는다.
          $back  = if ('${{ inputs.months_back }}')  { '${{ inputs.months_back }}' }  else { '3 (기본값)' }
          $ahead = if ('${{ inputs.months_ahead }}') { '${{ inputs.months_ahead }}' } else { '6 (기본값)' }

          @"
          ## 공연 데이터 갱신 결과

          | 항목 | 값 |
          |---|---|
          | 수집 건수 | **$($m.recordCount)** 건 |
          | 좌표 없음 | $($m.noCoordCount) 건 |
          | 상세 실패 | $($m.detailFailCount) 건 |
          | 공연장 | $($m.venueCount) 곳 |
          | 수집 범위 | $($m.rangeFrom) ~ $($m.rangeTo) |
          | 과거 / 미래 개월 | $back / $ahead |
          | 지도 파일 | $kb KB |
          | 소요 | $($m.elapsedMinutes) 분 |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($m.recordCount -lt 500) {
            Write-Host "::warning::수집 건수가 $($m.recordCount)건으로 평소보다 적습니다. KOPIS 응답을 확인하세요."
          }
          if ($m.detailFailCount -gt 0) {
            Write-Host "::warning::공연상세 조회 실패 $($m.detailFailCount)건. 아티팩트 logs 를 확인하세요. (다음 실행에서 자동 재시도됩니다)"
          }

      - name: 변경사항 커밋
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performances-data.js

          # 데이터가 그대로면 커밋하지 않는다. 빈 커밋이 쌓이지 않게 한다.
          #
          # 주의: PowerShell에서 `if (git diff --quiet)` 는 종료 코드가 아니라 표준출력을 본다.
          # --quiet은 아무것도 출력하지 않으므로 조건이 항상 거짓이 되어, 변경이 없을 때도
          # git commit을 시도하다 "nothing to commit"으로 스텝이 실패한다. 종료 코드를 봐야 한다.
          git diff --cached --quiet
          $noChange = ($LASTEXITCODE -eq 0)

          if ($noChange) {
            Write-Host "변경 없음. 커밋을 건너뜁니다."
          } else {
            $savedAt = (Get-Content "${{ github.workspace }}/tools/performances.json" -Raw -Encoding UTF8 | ConvertFrom-Json)._meta.savedAt
            git commit -m "데이터 갱신 ($savedAt)"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git push
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "커밋·푸시 완료"
          }

      - name: 실패 내역 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            tools/logs/detail-failures.json
          if-no-files-found: ignore
          retention-days: 30
